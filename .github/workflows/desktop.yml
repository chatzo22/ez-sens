name: Desktop app (Windows)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build installer + portable
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: ez-sens-windows
          path: app/dist/*.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/*.exe
          make_latest: true
          body: |
            EZ Sens for Windows — offline aim trainer, shooting range and sensitivity converter.

            **EZ-Sens-Setup-*.exe** installs it (Start menu + desktop shortcut). **EZ-Sens-Portable-*.exe** runs without installing.

            The app is not code-signed, so Windows SmartScreen will warn: click **More info → Run anyway**.

            Unlock FPS beyond your monitor: View menu → *Unlock FPS*, or the checkbox in Train → frame-rate settings (applies after restart). Then pick 60/100/144/240/custom/uncapped in the frame-rate setting.
